[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powersimbuilder-runtime"
version = "0.9.0"
description = "PowerSimBuilder Python runtime (control board I/O simulation)"
requires-python = ">=3.10"
dependencies = [
    "fmpy>=0.3.20",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/integration"]
pythonpath = [".", "src"]
addopts = "-ra -q --basetemp=.pytest_tmp"
filterwarnings = [
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Physical-quantity variable names (P, V, R, T, A, ...) are conventional
# in engineering code and tests; disable the "should be lowercase" rule.
"src/python_runtime/components/*.py" = ["N806"]
"tests/python/*.py" = ["N806"]

[tool.setuptools]
packages = [
    "python_runtime",
    "python_runtime.components",
    "python_runtime.statable",
    "python_runtime.lib",
    "examples",
]

[tool.setuptools.package-dir]
python_runtime = "src/python_runtime"
"python_runtime.components" = "src/python_runtime/components"
"python_runtime.statable" = "src/python_runtime/statable"
examples = "examples"

[tool.mypy]
python_version = "3.10"
files = ["src/python_runtime", "examples"]
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "numpy.*"]
ignore_missing_imports = true

[project.optional-dependencies]
dev = [
    "types-PyYAML",
]
