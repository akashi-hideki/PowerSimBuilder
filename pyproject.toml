[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powersimbuilder-runtime"
version = "0.2.0.dev0"
description = "PowerSimBuilder Python runtime (control board I/O simulation)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = [".", "src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.setuptools]
packages = [
    "python_runtime",
    "python_runtime.components",
    "examples",
]

[tool.setuptools.package-dir]
python_runtime = "src/python_runtime"
"python_runtime.components" = "src/python_runtime/components"
examples = "examples"
