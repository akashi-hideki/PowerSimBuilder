repos:
  # Runs FIRST so auto-fix happens before validation (traps #24).
  - repo: local
    hooks:
      - id: i18n-check
        name: i18n JSON auto-fix
        entry: python tools/i18n_check.py --fix
        language: system
        files: ^Resources/i18n/.*\.json$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: \.(py|md|yml|yaml|toml|txt|json)$
        exclude: ^(MD/|pythonlib/|previou_files/|tools/|CanvasForm/確認ファイル\.md$|parts/ListDictionaryConverte\.md$)
      - id: end-of-file-fixer
        files: \.(py|md|yml|yaml|toml|txt|json)$
        exclude: ^(MD/|pythonlib/|previou_files/|tools/|CanvasForm/確認ファイル\.md$|parts/ListDictionaryConverte\.md$)
      - id: check-yaml
        files: \.(yml|yaml)$
      - id: check-toml
        files: \.toml$
      - id: check-json
        files: ^Resources/i18n/.*\.json$
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        files: \.(py|md|yml|yaml|toml|txt)$
        exclude: ^(MD/|pythonlib/|previou_files/|tools/|CanvasForm/確認ファイル\.md$|parts/ListDictionaryConverte\.md$)
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^(src/python_runtime|tests/python|examples)/
      - id: ruff-format
        files: ^(src/python_runtime|tests/python|examples)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^(src/python_runtime|examples)/
        args: ["--config-file=pyproject.toml"]
        pass_filenames: false
        additional_dependencies:
          - types-setuptools

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (tests/python, pre-push)
        entry: python -m pytest tests/python -q --basetemp=.pytest_tmp
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
