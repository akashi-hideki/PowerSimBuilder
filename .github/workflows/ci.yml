name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  SOLUTION_FILE: 'PowerSimBuilder.sln'
  TEST_PROJECT: 'PowerSimBuilder.Tests/PowerSimBuilder.Tests.csproj'

jobs:
  build-and-test:
    name: Build & Test (Windows, .NET 10)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build (Release)
        run: dotnet build ${{ env.SOLUTION_FILE }} -c Release --no-restore -v:minimal

      - name: Run Tests
        run: dotnet test ${{ env.TEST_PROJECT }} -c Release --no-build --logger "trx;LogFileName=test-results.trx" --verbosity minimal

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx

  code-quality:
    name: Code Quality (.NET 10)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build with Warnings as Errors
        run: dotnet build ${{ env.SOLUTION_FILE }} -c Release --no-restore -p:WarningLevel=4 -v:minimal
